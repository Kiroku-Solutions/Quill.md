services:
  hocuspocus:
    build: .
    ports:
      - '1234:1234'
    environment:
      - NODE_ENV=production
      - PORT=1234
      - HEALTH_PORT=8080
      - DB_PATH=/app/data/hocuspocus.sqlite
      # V8 heap limit — ~80% of container memory limit to let GC act before OOM
      - NODE_OPTIONS=--max-old-space-size=400
      # Documents untouched for this many days are purged from SQLite
      - STALE_DAYS=7
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    volumes:
      - hocuspocus-data:/app/data
    restart: unless-stopped
    # Give server.destroy() time to flush pending documents to SQLite
    stop_grace_period: 30s
    healthcheck:
      # Uses Node built-in fetch (Node 22+) — no wget/curl needed in slim image
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

volumes:
  hocuspocus-data:
